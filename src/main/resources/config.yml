  world: world
  start: {x: 0.5, y: 65.0, z: 0.5}
  direction: {x: 1.0, z: 0.0}
  length: 80.0
  lane-spacing: 1.8

bossbar:
  # false = ẩn BossBar KirKeiba.
  enabled: true
  # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20.
