# =============================================================
# KIR KEIBA - FILE CẤU HÌNH
# Màu dùng &: &a xanh, &c đỏ, &e vàng, &7 xám, &f trắng.
# Placeholder chung: {race}, {seconds}, {state}, {pool}.
# Ngựa: {number}, {name}, {style}, {power}, {stamina}, {finish}, {odds}.
# Vé: {type}, {required}, {stake}, {payout}, {description}, {example}.
# Khi đã chọn loại vé: {house_seed}=tiền server tài trợ cho thị trường đó.
# GUI pool: {tickets}, {players}, {player_pool}, {market_pool}, {page}, {pages},
#   {player}, {player_tickets}, {player_total}, {ticket_id}, {selection}, {ticket_odds}.
# Kết quả: {first}, {second}, {first_number}, {second_number}.
# Vòng kế tiếp: {next_race}.
# Điều kiện vòng: {distance}, {meters}, {surface}, {track_state}, {weather}.
# Riêng lore ngựa: {style_modifier}=mức bonus style thay đổi trong điều kiện hiện tại.
# Placeholder sai hoặc chưa có dữ liệu sẽ hiện dấu —.
# =============================================================

# KINH TẾ CHUNG
economy:
  # Giá dự phòng cho config cũ. Nên chỉnh stake trong từng bet-types.
  bet-unit: 10000.0
  # 0.15 = giữ 15% pool; 85% còn lại được chia cho vé thắng.
  house-edge: 0.15
  # Tổng số vé tối đa mỗi người được mua trong một vòng.
  max-tickets-per-player: 5
  # Tiền ảo do server tài trợ cho TỪNG thị trường ở mỗi vòng.
  # Khoản này không bị trừ từ tài khoản nào; nó là money faucet giúp một người chơi vẫn có lãi.
  # Ví dụ WIN: người chơi cược 30.000, seed 30.000, phí 15% => hệ số tự nhiên x1,70.
  house-seed-pool:
    WIN: 30000.0
    PLACE: 30000.0
    UMAREN: 50000.0
    EXACTA: 75000.0
    TRIFECTA: 100000.0
  # Sàn hệ số: nếu công thức pool thấp hơn giá trị này, server bù phần còn thiếu.
  # 1.20 nghĩa là cược 10.000 và thắng sẽ nhận tối thiểu 12.000 (gồm cả vốn).
  minimum-odds:
    WIN: 1.20
    PLACE: 1.15
    UMAREN: 1.30
    EXACTA: 1.50
    TRIFECTA: 2.00
  # Trần hệ số để tránh một vé hiếm tạo payout quá lớn và gây lạm phát.
  maximum-odds:
    WIN: 10.0
    PLACE: 5.0
    UMAREN: 20.0
    EXACTA: 30.0
    TRIFECTA: 50.0

# Mỗi loại cược có pool độc lập. Có thể tắt từng loại hoặc đặt giá vé riêng.
# ======================== LOẠI CƯỢC ========================
# enabled: false sẽ tắt hoàn toàn và ẩn loại vé khỏi GUI.
# Loại còn bật được dồn lần lượt vào gui.bet-type-slots.
# stake là giá vé cố định của loại cược đó.
# description và example xuất hiện trong lore của nút loại cược.
bet-types:
  WIN:
    enabled: true
    stake: 10000.0
    description: 'Chọn 1 ngựa sẽ về đích đầu tiên.'
    example: 'Ví dụ: chọn #2, ngựa #2 về nhất là thắng.'
  PLACE:
    enabled: true
    stake: 10000.0
    description: 'Chọn 1 ngựa có thể về nhất, nhì hoặc ba.'
    example: 'Ví dụ: chọn #5, ngựa #5 nằm trong top 3 là thắng.'
  UMAREN:
    enabled: true
    stake: 10000.0
    description: 'Chọn 2 ngựa sẽ chiếm hạng nhất và nhì.'
    example: 'Chọn #2 và #5: kết quả 2-5 hoặc 5-2 đều thắng.'
  EXACTA:
    enabled: true
    stake: 15000.0
    description: 'Chọn đúng ngựa hạng nhất rồi đến hạng nhì.'
    example: 'Bấm #2 rồi #5: chỉ kết quả 2-5 mới thắng.'
  TRIFECTA:
    enabled: true
    stake: 20000.0
    description: 'Chọn đúng 3 ngựa về đầu theo thứ tự.'
    example: 'Bấm #2, #5, #1: chỉ kết quả 2-5-1 mới thắng.'

# ======================== LỊCH VÒNG ĐUA ========================
schedule:
  # CONTINUOUS: hết phần kết quả sẽ mở vòng mới ngay.
  # INTERVAL: nghỉ interval-seconds rồi mới mở vòng mới.
  mode: CONTINUOUS
  # Chỉ dùng với INTERVAL; là thời gian nghỉ giữa hai vòng.
  interval-seconds: 300
  # Thời gian được mua vé.
  betting-seconds: 180
  # Thời gian khóa cược trước khi đua.
  locked-seconds: 15
  # Thời gian hiển thị đang đua.
  running-seconds: 35
  # Thời gian giữ kết quả.
  result-seconds: 30

# MÔ PHỎNG KẾT QUẢ
race:
  # Số ngựa mong đợi; danh sách thực tế lấy từ horses bên dưới.
  horse-count: 8
  # Dành cho thông báo kết quả; giữ để tương thích cấu hình.
  announce: true
  # Càng nhiều bước, biến động ngẫu nhiên được lấy mẫu càng nhiều.
  simulation-steps: 35

# ======================== ĐIỀU KIỆN ĐƯỜNG ĐUA ẢO (MVP 4) ========================
# Plugin chọn 1 mục trong mỗi nhóm distances/surfaces/track-states/weather khi mở vòng.
# weight là trọng số xuất hiện, KHÔNG phải phần trăm. Ví dụ weight 25 và 75 tương ứng 25%/75%.
# enabled: false sẽ loại riêng mục đó khỏi danh sách chọn; enabled ở cấp cao nhất tắt toàn hệ thống.
# Các khóa *-multiplier nhân vào thành phần tương ứng trong công thức:
#   1.10 = tăng 10%, 1.00 = giữ nguyên, 0.90 = giảm 10%.
# power-multiplier tác động sức mạnh đầu chặng; stamina-multiplier tác động sức bền cả chặng;
# finish-multiplier tác động khả năng cuối chặng; randomness-multiplier tác động độ bất ngờ.
# style-multipliers chỉ nhân BONUS của style, không nhân toàn bộ tốc độ ngựa.
