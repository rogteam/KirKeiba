# ======================== KIỂM TRA CẬP NHẬT ========================
# Plugin chỉ đọc GitHub Release công khai, không tải hoặc tự cài JAR.
# Kiểm tra chạy bất đồng bộ nên không chặn main thread của server.
update-check:
  enabled: true
  # Repository GitHub theo định dạng owner/name.
  repository: 'rogteam/KirKeiba'
  # Tự kiểm tra một lần khi plugin bật. Chỉ ghi kết quả vào console.
  check-on-startup: true
  # /keiba admin help dùng kết quả cache trong thời gian này để tránh gọi API liên tục.
  cache-minutes: 30
  connect-timeout-seconds: 5
  request-timeout-seconds: 10
  # Placeholder: {current}, {latest}, {url}, {error}.
  messages:
    current: '&7Phiên bản KirKeiba hiện tại: &f{current}'
    checking: '&eĐang kiểm tra bản mới từ GitHub...'
    latest: '&aBạn đang dùng bản mới nhất: &f{current}'
    available: '&eCó bản KirKeiba mới &f{latest}&e: &b{url}'
    failed: '&cKhông thể kiểm tra cập nhật: &7{error}'
    disabled: '&8Kiểm tra cập nhật đang tắt trong config.'

horses:
# Tùy chọn cho từng ngựa: material, display-name và lore. Không khai báo sẽ dùng gui.horse.
# style chỉ nhận đúng một trong 4 giá trị viết hoa sau:
#   NIGE   (Dẫn đầu): được cộng lợi thế rất lớn ở đầu cuộc đua, sau đó giảm dần.
#   SENKO  (Bám đầu): chạy ổn định phía trước, mạnh nhất quanh giai đoạn 35% đường đua.
#   SASHI  (Tăng tốc giữa): chưa có bonus trước 45%, sau đó tăng tốc dần về cuối.
#   OIKOMI (Nước rút cuối): bị trừ nhẹ trước 70%, từ 70% trở đi nhận bonus nước rút lớn nhất.
