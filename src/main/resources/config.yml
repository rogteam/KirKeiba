  tickets:
    material: BOOK
    name: '&bVé của bạn'
  refresh:
    material: COMPASS
    name: '&eLàm mới'
    lore: ['&7Cập nhật trạng thái và hệ số thưởng']
  help:
    material: KNOWLEDGE_BOOK
    name: '&dHướng dẫn chơi'
    lore: ['&7Nhấn để xem luật Umaren và cách trả thưởng']
    title: '&0Wiki KIR Keiba'
    # Kích thước GUI wiki: 9, 18, 27, 36, 45 hoặc 54.
