name: KirKeiba
version: ${version}
main: vn.kir.keiba.KirKeibaPlugin
api-version: '1.21'
author: KIR
description: Đua ngựa Keiba với nhiều loại vé và hệ số thưởng pari-mutuel.
depend: [Vault]
libraries:
  - org.xerial:sqlite-jdbc:3.49.1.0
commands:
  keiba:
    description: Mở trường đua KIR Keiba
    usage: /keiba [status|tickets|admin]
permissions:
  kirkeiba.use:
    default: true
  kirkeiba.bet:
    default: true
  kirkeiba.admin:
    default: op
    children:
      kirkeiba.admin.forcestart: true
      kirkeiba.admin.cancel: true
      kirkeiba.admin.reload: true
      kirkeiba.admin.update: true
      kirkeiba.admin.reset: true
  kirkeiba.admin.forcestart:
    default: op
  kirkeiba.admin.cancel:
    default: op
  kirkeiba.admin.reload:
    default: op
  kirkeiba.admin.update:
    default: op
  kirkeiba.admin.reset:
    default: op
